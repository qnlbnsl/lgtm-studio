packages:
  - packages/*
  - plugins/*
  - third_party/t3code/*
  - src/*

catalog:
  effect: 4.0.5
  '@effect/platform-node': 4.0.5
  '@effect/platform-node-shared': 4.0.5
  '@effect/vitest': 4.0.5
  '@effect/openapi-generator': 4.0.5
  '@types/node': 26.6.6
  '@types/ws': 8.18.2
  vitest: 5.0.5
  # T3 Code builds with this TypeScript port, and the copied packages in
  # third_party/t3code are checked with the same compiler. Do not change it alone.
  typescript: npm:@tsc-rs/typescript@0.8.0
  ws: 8.22.0
  fast-check: 4.10.2
  # New client dependencies were published by 2026-10-21 (two weeks before setup).
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.4
  ink: 8.0.0
  # The website in src/frontend. Each was published by 2026-11-08.
  preact: 11.2.0
  '@preact/preset-vite': 2.10.6
  '@babel/core': 7.29.13
  '@playwright/test': 1.64.1
  # The contract in src/contracts and its two users. Each was published by 2026-11-05.
  '@bufbuild/buf': 1.75.0
  '@bufbuild/protobuf': 2.17.0
  '@bufbuild/protoc-gen-es': 2.17.0
  '@connectrpc/connect': 2.3.0
  '@connectrpc/connect-web': 2.3.0
  '@connectrpc/connect-node': 2.3.0
  jsdom: 30.1.3

allowBuilds:
  '@tsc-rs/typescript@0.8.0': true
  # buf's install script only fetches its program when the platform package is missing.
  '@bufbuild/buf@1.75.0': false
strictDepBuilds: true

# platform-node otherwise accepts a newer shared package requiring Effect 4.1.
overrides:
  effect: 'catalog:'
  '@effect/platform-node': 'catalog:'
  '@effect/platform-node-shared': 'catalog:'
