name: lgtm

x-postgres-image: &postgres-image postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
x-openbao-image: &openbao-image openbao/openbao:2.7.3@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9

services:
  postgres:
    image: *postgres-image
    user: "70:70"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/lgtm-db/postgres-admin.password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/admin/postgres-admin.password
        target: /run/lgtm-db/postgres-admin.password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/server/postgres-app.password
        target: /run/lgtm-db/postgres-app.password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/bao/postgres-bao.password
        target: /run/lgtm-db/postgres-bao.password
        read_only: true
        bind:
          create_host_path: false
    networks: [data]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          probe() {
            PGPASSWORD="$$(cat "/run/lgtm-db/postgres-$$1.password")" \
              psql -Xw -h 127.0.0.1 -U "$$2" -d "$$2" -v ON_ERROR_STOP=1 -Atqc 'SELECT 1';
          };
          probe app lgtm_app && probe bao lgtm_bao
      interval: 2s
      timeout: 5s
      retries: 3

  openbao:
    image: *openbao-image
    user: "10002:10002"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/openbao-start.sh", "server"]
    command: []
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_API_ADDR: http://openbao:8200
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./openbao.hcl
        target: /openbao/config/lgtm.hcl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./openbao-start.sh
        target: /openbao-start.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/bao/postgres-bao.password
        target: /run/lgtm-db/postgres-bao.password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/bao/unseal.key
        target: /run/lgtm-bao/unseal.key
        read_only: true
        bind:
          create_host_path: false
    networks: [data, vault]
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 2s
      timeout: 5s
      retries: 3

  openbao-init:
    image: *openbao-image
    profiles: [setup]
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "/openbao-init.sh"]
    command: []
    configs:
      - source: openbao-init-script
        target: /openbao-init.sh
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/admin
        target: /admin
        bind:
          create_host_path: false
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/server
        target: /server
        bind:
          create_host_path: false
      - type: bind
        source: ./openbao-server-policy.hcl
        target: /openbao-server-policy.hcl
        read_only: true
        bind:
          create_host_path: false
    networks: [vault]

  prepare:
    image: *postgres-image
    profiles: [setup]
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    network_mode: none
    entrypoint: ["/bin/sh", "/stack-prepare.sh"]
    configs:
      - source: prepare-script
        target: /stack-prepare.sh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}
        target: /state
        bind:
          create_host_path: false

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      target: runtime
    image: lgtm-server:${LGTM_IMAGE_TAG:-local}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    # A mapping, so that an override can remove one key with !reset.
    environment:
      LGTM_WEB_PASSWORD: ${LGTM_WEB_PASSWORD:-}
      LGTM_LISTEN_ADDR: ":8080"
      LGTM_PUBLIC_URL: http://127.0.0.1:${LGTM_WEB_PORT:-8787}
      LGTM_POSTGRES_HOST: postgres
      LGTM_POSTGRES_PORT: "5432"
      LGTM_POSTGRES_DATABASE: lgtm_app
      LGTM_POSTGRES_USER: lgtm_app
      LGTM_POSTGRES_PASSWORD_FILE: /run/lgtm/postgres.password
      LGTM_ALLOW_PRIVATE_STACK: "true"
      LGTM_OPENBAO_ADDR: http://openbao:8200
      LGTM_OPENBAO_CREDENTIAL_FILE: /run/lgtm/openbao.json
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/server/openbao.json
        target: /run/lgtm/openbao.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LGTM_STACK_STATE_DIR:-./.state}/server/postgres-app.password
        target: /run/lgtm/postgres.password
        read_only: true
        bind:
          create_host_path: false
    # The server publishes no port. The web server reaches it on the internal network app.
    networks: [app, data, vault]
    # The start period covers a first start that migrates the database.
    healthcheck:
      test: ["CMD", "/usr/local/bin/lgtm-server", "health"]
      start_period: 8m
      start_interval: 2s
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/website.Dockerfile
      target: runtime
    image: lgtm-web:${LGTM_IMAGE_TAG:-local}
    user: "10003:10003"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    # The address is written here and not taken from a setting, so the port stays on loopback.
    ports:
      - "127.0.0.1:${LGTM_WEB_PORT:-8787}:8080"
    networks: [edge, app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 3

configs:
  prepare-script:
    file: ./stack-prepare.sh
  openbao-init-script:
    file: ./openbao-init.sh

networks:
  # The web server's network to the host's published port.
  edge: {}
  # The web server reaches the server here, with no route out.
  app:
    internal: true
  data:
    internal: true
  vault:
    internal: true

volumes:
  pgdata:
