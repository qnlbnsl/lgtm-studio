version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: gen
    opt:
      - target=js+dts
      - import_extension=js
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
