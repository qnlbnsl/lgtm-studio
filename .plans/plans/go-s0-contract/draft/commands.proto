// Commands from the server to a machine.
//
// The life of a command:
// - The server stores a command before it sends it, with its id, attempt 1 and its expiry.
//   The expiry never changes. The server stores each higher attempt before it sends it.
// - The server sends a pending command on each new current stream of its machine, with the next
//   attempt number, until it holds a final result. It sends a command other than SetState at most
//   until 23 hours after expires_at, and never later.
// - The server stores a matching result for a pending command until it records
//   COMMAND_OUTCOME_EXPIRED itself, which is no earlier than 24 hours after expires_at, when it
//   holds no final result. That outcome then means that no result arrived and the effect of the
//   command is unknown. SetState is the exception: it stays pending until it has a result,
//   whatever its expires_at.
// - A removal of the machine ends every pending command of it, SetState included.
// - The first final outcome that the server stores is final. A later result changes nothing.
// - Every outcome except COMMAND_OUTCOME_UNSPECIFIED is final. The server never sends a command
//   again once it holds a final result for it.
// - A command that arrives twice runs once. A machine answers every attempt of a command it
//   started with the result it recorded, until 24 hours after expires_at by its own clock. The
//   hour between the server's last attempt and that time is the margin for the two clocks.
// - At most once holds while the machine's clock runs ahead of the server's by less than one hour
//   minus the time from the server's send of an attempt to the machine's lookup of its record. A
//   machine beyond that may answer COMMAND_OUTCOME_EXPIRED for a command it ran, and one more
//   than a day fast may run a command again after its record was removed. Wave 1 accepts that
//   limit.
// - The server's clock decides expiry, and Welcome.server_time gives it. A command starts only
//   before expires_at. A machine that has not started a command answers COMMAND_OUTCOME_EXPIRED
//   when it cannot establish that it starts before expires_at. The promise that no command starts
//   late holds while the server's clock runs without a jump after Welcome.server_time was read.
// - A recorded result comes before every rule of expiry: an attempt that finds one gets it.
// - A machine answers every SetState with COMMAND_OUTCOME_DONE, whatever its expires_at, once it
//   has applied the state or found that its revision is not higher than the one it holds.
syntax = "proto3";

package lgtm.link.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/qnlbnsl/lgtm-studio/src/contracts/gen/go/lgtm/link/v1;linkv1";

// Command is one thing the server asks a machine to do.
message Command {
  // A version 7 UUID that the server makes. It names the command on every attempt.
  string id = 1;
  // 1 for the first send. It grows by one each time the server sends the same command again,
  // and it never wraps.
  uint32 attempt = 2;
  // The time after which the command does not start. The same on every attempt.
  google.protobuf.Timestamp expires_at = 3;
  // What the machine does.
  oneof action {
    // Look for installed harnesses again.
    ScanHarnesses scan_harnesses = 10;
    // The owner approved, renamed or removed the machine.
    SetState set_state = 11;
    // End the client program, so that the service of its user starts it again.
    Restart restart = 12;
  }
}

// CommandResult answers one attempt of a command.
//
// - The machine sends a result under the newest attempt it received for that command. A command
//   that is still running when a newer attempt arrives sends its result under the newer attempt.
// - A machine that receives a command it holds a final receipt for sends the recorded result
//   under the new attempt, also after expires_at, and does not run the command again.
// - The server accepts a result only from the current stream of the command's machine, and only
//   for the attempt it sent last. It ignores a copy of a result it already stored, a result for
//   an older attempt and a result for a later attempt.
// - The server stores COMMAND_OUTCOME_UNSPECIFIED, and an outcome it does not know, as
//   COMMAND_OUTCOME_FAILED.
message CommandResult {
  // The id of the command this result answers.
  string command_id = 1;
  // The attempt this result answers.
  uint32 attempt = 2;
  // How the command ended. The server writes the text that the website shows from it.
  CommandOutcome outcome = 3;
  reserved 4;
  reserved "message";
}

// CommandOutcome is how one command ended.
enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  // The machine did the command.
  COMMAND_OUTCOME_DONE = 1;
  // The machine tried the command, and it failed.
  COMMAND_OUTCOME_FAILED = 2;
  // From a machine: it did not start the command, because it could not establish that it would
  // start before the command's expiry, and it never starts it later. Recorded by the server
  // itself: no result arrived within 24 hours after the expiry, and the effect is unknown.
  COMMAND_OUTCOME_EXPIRED = 3;
  // The machine does not know the command's action, because its client is older than the server.
  COMMAND_OUTCOME_UNSUPPORTED = 4;
  // The machine started the command and stopped before it recorded how the command ended, so the
  // effect is unknown. The machine does not run it again, and a new action needs a new command.
  COMMAND_OUTCOME_INTERRUPTED = 5;
}

// ScanHarnesses asks the machine to look for installed harnesses again. The machine answers
// COMMAND_OUTCOME_DONE only after its HarnessesFound event is on disk, and
// COMMAND_OUTCOME_FAILED when its buffer refused the event.
message ScanHarnesses {}

// Restart asks the machine to end its client program, so that the service of its user starts it
// again. COMMAND_OUTCOME_DONE means that the machine accepted the restart and recorded that before
// it answered. The machine's next stream then comes from the new program.
message Restart {}

// SetState gives the machine its new standing.
message SetState {
  // The new standing.
  MachineState state = 1;
}

// MachineState is the standing the owner gave a machine.
//
// A machine applies a state only when its revision is higher than the revision it applied last.
// A state with the same revision and the same content changes nothing. A state with the same
// revision and other content is a fault of the server: the machine keeps the state it holds and
// logs one sentence. The machine applies Welcome.state before any command of the same stream.
message MachineState {
  // A machine treats APPROVAL_UNSPECIFIED and a value it does not know as APPROVAL_WAITING.
  Approval approval = 1;
  // The name the owner gave the machine. Empty while it waits for approval.
  string name = 2;
  // 1 for the first standing of a machine id. It grows with each change, and it never wraps.
  uint64 revision = 3;
}

// Approval is whether the owner let the machine work.
enum Approval {
  APPROVAL_UNSPECIFIED = 0;
  // The machine joined, and the owner has not approved it. It receives no work.
  APPROVAL_WAITING = 1;
  // The owner approved the machine.
  APPROVAL_APPROVED = 2;
  // The owner removed the machine. The server may send this on the current stream before it
  // ends it, and nothing waits for its delivery. A machine treats it as APPROVAL_WAITING, answers
  // COMMAND_OUTCOME_DONE, keeps its stream and does not stop, because only the refusal after a
  // verified Challenge proves a removal. See
  // LinkService.Open.
  APPROVAL_REMOVED = 3;
}
