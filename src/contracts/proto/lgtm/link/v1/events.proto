// Events and heartbeats from a machine to the server.
//
// An event is a report that the server processes in order and at most once. The machine numbers
// its events and keeps them on disk until the server acknowledges them. A heartbeat only says
// that the machine is there, so it is never numbered or kept.
//
// The order of events. The server alone decides what was applied.
// - A machine numbers its events from 1, with no gaps, and never reuses or changes a number.
// - The server keeps the last committed event number for each machine. It writes that number in
//   the same transaction as any event effect and result settlement.
// - Welcome.last_event_number is the durable replay mark. The client checks the Welcome mark
//   against its saved event history before it forgets any event or advances its saved
//   acknowledgement. Only after that check passes does the client forget events at or below
//   the mark and send the rest in order from the next number.
// - The machine may hand over up to 32 events ahead of Welcome or the latest acknowledgement.
// - Only the current stream's events count. The server ignores an event of another stream.
// - The server decides each event of the current stream by this table, which comes before the
//   value rules of link.proto. A message that cannot be decoded ends the stream with
//   `invalid_argument`. For a decoded event, the server reads only the number, until the last
//   step:
//   - A number of 0, or above 2^63 - 1, ends the stream with `invalid_argument`, before any
//     comparison or arithmetic. At the last applied number 2^63 - 1, every valid number is a
//     repeat.
//   - A number at or below the mark is a repeat and receives one cumulative EventAck through
//     that mark, whatever the report holds. Nothing is applied again.
//   - A number above the next one is a gap and receives no acknowledgement. The server ends
//     this stream with
//     `failed_precondition` and the reason event_gap, whatever the report holds. A later stream
//     that sends the missing number goes on.
//   - At the next number, and only there, the server checks the report's value rules and applies
//     a valid, eligible report. It consumes an absent, unknown, invalid or approval-blocked report
//     without applying it. This covers a zero byte in a string, a value above its limit and an
//     oversized event received within the outer message limit. Every eligible next event receives
//     one cumulative EventAck after the commit that advances its mark.
// - Bad numbers, undecodable frames, failed writes and obsolete streams receive no acknowledgement.
// - One machine id has one outbox. A Welcome mark at or above local next or below the retained
//   floor minus one is incompatible. The floor is the first retained number, or local next for
//   an empty queue. An incompatible Welcome mark leaves all state on disk unchanged, including
//   the retained event bytes and saved acknowledgement. Missing or corrupt required history
//   stops replay without a fabricated advance. Restore the real prefix or remove the machine
//   and enroll again. A server database rollback or indistinguishable client history is outside
//   wave 1.
// - When it becomes approved on a stream, by a Welcome or by a SetState, the machine sends its
//   current Facts and HarnessesFound as new events.
//
// The complete encoded Command or Event is limited to 49,152 bytes. The server budgets a
// command before storing it, using the widest attempt it can send. The machine budgets an
// event with the number it will receive before allocating that number. A failed append
// consumes no event number.
syntax = "proto3";

package lgtm.link.v1;

import "google/protobuf/timestamp.proto";
import "lgtm/link/v1/folders.proto";

option go_package = "github.com/qnlbnsl/lgtm-studio/src/contracts/gen/go/lgtm/link/v1;linkv1";

// Event is one numbered report.
message Event {
  // 1 for the machine's first event, and one more for each event after it. An event number above
  // 2^63 - 1 is refused with `invalid_argument`, and a client never sends one.
  uint64 number = 1;
  // When the machine made the report, by its own clock. The server orders nothing by it, and it
  // does not store or show it in wave 1.
  google.protobuf.Timestamp happened_at = 2;
  // What the event reports.
  oneof report {
    // The machine's facts as they are now.
    Facts facts = 10;
    // The harnesses the machine found in its latest scan.
    HarnessesFound harnesses_found = 11;
    // The facts or refusal for a specific folder command.
    FolderSeen folder_seen = 12;
  }
}

// EventAck tells the machine which events it may forget.
//
// The server sends it on the stream that sent the event. A next event is acknowledged only
// after the transaction that advances the mark commits. A repeat uses the current mark.
message EventAck {
  // The last durable event number, including when the acknowledgement answers a repeat.
  uint64 through = 1;
}

// Facts describe the machine, as the machine reports them. The server shows them and trusts
// nothing in them.
message Facts {
  // The operating system, such as "Linux" or "macOS". At most 64 bytes.
  string os = 1;
  // The number of processor cores, at least 1.
  uint32 cores = 2;
  // The memory of the machine in bytes. The website shows it in gigabytes of 2^30 bytes,
  // rounded to the nearest whole number.
  uint64 memory_bytes = 3;
  // The version of the client program. At most 64 bytes.
  string client_version = 4;
  // The folder that holds the machine's repositories, such as "~/projects". At most 256 bytes.
  string workspace = 5;
  // How many agents the machine may run at once.
  uint32 agent_limit = 6;
}

// HarnessesFound lists each harness the machine looked for. The server counts the machine's
// harnesses as scanned once it holds one.
message HarnessesFound {
  // At most 16 harnesses.
  repeated Harness harnesses = 1;
}

// Harness is one harness the machine looked for.
message Harness {
  // "claude", "codex", "gemini" or "cursor". At most 32 bytes.
  string name = 1;
  // Its version, at most 64 bytes. Absent when the harness is not installed, or when its
  // version could not be read.
  optional string version = 2;
}

// Heartbeat says that the machine is there, with its load. The machine sends one every 10
// seconds on the current stream. The server marks the machine offline and ends the stream after
// 30 seconds without one, measured by the server's monotonic clock.
message Heartbeat {
  // The load of the processor, from 0 to 100. Absent when the machine could not measure it.
  // A heartbeat without load still shows that the machine is there.
  optional uint32 cpu_percent = 1;
  // The memory in use, from 0 to 100. Absent when the machine could not measure it.
  optional uint32 memory_percent = 2;
}

// HeartbeatAck answers each heartbeat of the current stream, so that traffic moves both ways
// and a web server in front of the server does not cut the stream.
// A machine that hears nothing from the server for 30 seconds ends the stream and dials again.
message HeartbeatAck {}
