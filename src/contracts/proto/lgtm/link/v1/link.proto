// What a server and a machine say to each other.
//
// A machine is a computer that runs the client program. It dials the server, and the server
// never dials it. The machine joins once with a token, and from then on it keeps one two-way
// stream open. Both ends prove themselves at the start of every stream.
//
// The website never calls this package. Its calls are in package lgtm.v1.
//
// Values that every message of this package keeps. A message that breaks one is refused with
// `invalid_argument`. After Welcome, the table of events in events.proto comes before these rules
// for every event.
// - The id of a machine, a command or a token is a UUID in its canonical form: 36 characters of
//   lowercase hexadecimal digits and hyphens.
// - A nonce is exactly 32 bytes, a public key exactly 32 bytes, a signature exactly 64 bytes, and
//   a SHA-256 exactly 32 bytes. certificate_key_sha256 may also be empty.
// - Command.attempt, Event.number and MachineState.revision are at least 1. Event.number is at
//   most 2^63 - 1, which is 9223372036854775807.
// - Hello.first_event_number is in [1, 2^63], and CommandResult.last_event_number is in
//   [0, 2^63 - 1].
// - The 65,536-byte limit covers the complete Protocol Buffers message wrapper after
//   decompression and excludes transport framing.
// - Facts.cores is at least 1. HarnessesFound holds at most 16 harnesses. Heartbeat.cpu_percent
//   and Heartbeat.memory_percent, when present, are 0 to 100.
// - Command.expires_at, Welcome.state and Welcome.server_time are present.
// - A string is valid UTF-8, holds no zero byte, and keeps the limit its comment gives.
// - A heartbeat that breaks a rule ends the stream with `invalid_argument`, like any message
//   that is not an event.
syntax = "proto3";

package lgtm.link.v1;

import "google/protobuf/timestamp.proto";
import "lgtm/link/v1/commands.proto";
import "lgtm/link/v1/events.proto";

option go_package = "github.com/qnlbnsl/lgtm-studio/src/contracts/gen/go/lgtm/link/v1;linkv1";

// LinkService is what a machine calls on the server.
//
// Join needs a join token. Open needs the machine's key. Neither needs a website session, and
// the session rule of package lgtm.v1 does not apply to them. A later call beside the stream,
// such as a byte stream, presents the connection token of the current stream in the header
// `Lgtm-Link-Token`.
//
// The codes of the server, and what a machine does on each. A final code depends only on the
// request and on the server's state when the server decides it: the same request against the same
// state gets the same answer. A machine stops trying on a final code and tells the owner. Every
// other code may change on a later try, and the machine dials again. The file
// src/contracts/testdata/link-codes.json holds this table as data.
//
// A refusal's reason is one word in the metadata of the error, under a key that the table names.
// The Connect protocol carries the metadata of a unary error as response headers, and that of a
// stream's error in the end-of-stream message. The gRPC protocol carries both as trailers.
//
//   Join  permission_denied    stop       The key `Lgtm-Join-Refusal` holds the reason.
//   Join  invalid_argument     stop       The request breaks a value rule.
//   Open  failed_precondition  stop       After a Challenge whose signature verified. The key
//                                         `Lgtm-Link-Refusal` holds the reason: unknown_machine
//                                         for a machine id the server does not know, also after a
//                                         removal, or link_revision_mismatch for a link revision
//                                         the server does not speak. Before a verified Challenge,
//                                         the machine dials again.
//   Open  failed_precondition  dial again The key `Lgtm-Link-Refusal` holds event_gap, for an
//                                         event above the next number. It ends only that stream,
//                                         and on the next the machine sends from the number
//                                         above Welcome.last_event_number.
//   Open  unauthenticated      dial again The machine's signature did not verify.
//   Open  aborted              dial again A newer stream of the same machine replaced this one.
//   Open  invalid_argument     dial again A message out of order, or one that breaks a value rule.
//   Open  deadline_exceeded    dial again Hello or Proof came more than 10 seconds late.
//   both  unavailable          dial again The server cannot read its database. It never answers a
//                                         final code for that reason.
//
// For Open failed_precondition, a reason the machine does not know, or a missing reason, means
// dial again. Both stops of Join hold whatever the reason, which serves only to tell the owner.
service LinkService {
  // Join trades a join token for the server's public key, and registers the machine's public key.
  //
  // - The server checks the value rules in two phases. Before it looks the token up, it checks
  //   token_id, token_secret and machine_public_key, and refuses a request that breaks one with
  //   `invalid_argument`. It checks host_name only before it creates a waiting machine, after
  //   every refusal below and after the replay, and refuses a bad host_name there with
  //   `invalid_argument`. A replay and a refusal never read the host name.
  // - The server then refuses with `permission_denied`, checking in this order against its state at
  //   the moment it decides. The reason under the key `Lgtm-Join-Refusal` is one word, and the error's
  //   message is a sentence for people.
  //   - token_unknown: no token has the id, or the secret does not match the token's verifier.
  //     The server checks the secret before it looks at any other state of the token.
  //   - token_expired: the token's expiry has passed by the server's clock.
  //   - token_revoked: the owner revoked the token.
  //   - token_used: the token is bound to another machine key.
  //   - machine_removed: the machine that used the token with this key was removed.
  // - A token that passes those checks and is not used yet is claimed. In the same transaction
  //   the server binds the token to the machine's key and creates the waiting machine. Of two
  //   first uses at once, exactly one wins. The loser is decided again by the same order, against
  //   the state at that moment: with the same key it is a replay, and with another key it gets
  //   token_used, unless an earlier refusal applies by then.
  // - A token that passes those checks and is used by the same key is a replay. It returns the
  //   first reply and creates nothing.
  // - A failure before the commit changes nothing and returns `unavailable`.
  // - Revoking a used token removes its machine while the machine still waits for approval. It
  //   changes nothing for an approved machine, whose later replays are refused as token_revoked.
  // - A reply that is lost cannot be fetched again after the token expired, because token_expired
  //   comes before the replay. The machine then joins with a new token, and the owner removes the
  //   waiting machine that the first join left.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Open is the stream between a machine and the server. The machine sends first.
  //
  // The handshake:
  // - The machine sends Hello. The server answers with Challenge. The machine sends Proof. The
  //   server answers with Welcome.
  // - The server answers every well-formed Hello with a Challenge before it looks the machine up
  //   or reads its link revision. Then it decides in this order, and may do so before Proof
  //   arrives:
  //   - `unavailable` when it cannot look the machine up.
  //   - `failed_precondition` with unknown_machine when it does not know the machine id.
  //   - `failed_precondition` with link_revision_mismatch when it does not speak the revision.
  //   - `deadline_exceeded` when Proof is not there 10 seconds after it sent Challenge.
  //   - `invalid_argument` when Proof breaks a value rule.
  //   - `unauthenticated` when the machine's signature does not verify.
  // - So a caller without the machine's key can learn whether a machine id is known and which
  //   revision the server speaks. Wave 1 accepts that: machine ids are random version 7 UUIDs,
  //   the server has one user, and no state changes before the signature verified.
  // - Before Welcome, a message of another kind, an empty message, or a message that breaks a rule
  //   of this package ends the stream with `invalid_argument`.
  // - The server ends the stream with `deadline_exceeded` when Hello is not there 10 seconds after
  //   the stream opened.
  // - The server validates run history after Proof verifies and the revision check passes.
  //   It defers validation of the Hello run fields until that history check.
  //   History refusal uses the existing retryable `invalid_argument` and leaves the incumbent
  //   stream and command ledger intact.
  //
  // Run admission and readiness:
  // - Only the latest admitted run may reconnect, even while draining. A reconnect repeats the
  //   exact saved boundary. The server refuses superseded runs before boundary validation, even
  //   after restart and at equal boundaries.
  // - An unseen run begins above the committed event mark and staged result watermarks, and at
  //   or above any pending boundary. At a tie between unseen runs, the later successful
  //   admission takes precedence. The server saves the admitted run and its boundary together.
  // - The run becomes ready once when the durable mark reaches first_event_number - 1. The
  //   server checks readiness on admission and whenever the mark advances. Before readiness
  //   there is no command claim, shared send permit or advance of the command cursor.
  //
  // The current stream:
  // - The admission of a stream is one commit of the server's database, after its Proof verified.
  //   That commit both replaces the older stream and lets the server send the new stream's first
  //   frame, its Welcome. From that commit the older stream is not current, even while its end is
  //   in transit, and nothing that arrives on it changes the machine.
  // - The server reads Welcome.last_event_number after that moment, so it holds every event that
  //   the older stream committed.
  // - Once a newer admission of the same machine commits, the server does not start to send the
  //   Welcome of an older stream. A Welcome it had already started to send may still arrive. The
  //   older stream ends with `aborted`, also when the newer stream has already ended.
  // - A stream stops being current when it ends, when a newer stream becomes current, or when the
  //   removal of its machine commits.
  //
  // After Welcome:
  // - Each encoded message is limited to 65,536 bytes including the outer wrapper, and the
  //   receive limit applies after decompression. Transport framing is outside this budget.
  // - Heartbeats and retained events can travel while the run drains. Events keep the order
  //   that events.proto gives. The server sends replay acknowledgements before gated SetState,
  //   including when approval arrives while replay is finishing.
  // - A receiver ignores a message of a kind it does not know, because wave 2 adds kinds with
  //   numbers not used yet.
  // - A newer stream of the same machine replaces this one only when its admission commits.
  // - A machine that hears nothing from the server for 30 seconds ends the stream and dials again.
  //   HeartbeatAck makes that silence a signal.
  //
  // What the website shows of a machine:
  // - Waiting, while its standing is APPROVAL_WAITING, whether or not it has a stream.
  // - Offline, while it is approved and has no current stream.
  // - Joining, while it is approved, has a current stream, and the server has not yet applied both
  //   a valid Facts and a valid HarnessesFound from that stream while the machine was approved.
  // - Online, while it is approved, has a current stream, and the server applied both from it.
  //
  // A machine that waits for approval:
  // - Its Welcome holds an empty connection token. A machine gets a connection token in the
  //   Welcome of a stream that opens after its approval, also when it was approved on a live
  //   stream. No call of wave 1 presents the token.
  // - The server sends it only SetState after run readiness and ignores its command results
  //   while approval is pending.
  // - A machine waiting for approval can replay retained pre-run events and send heartbeats.
  //   While it waits, the server applies valid Facts and consumes other eligible events without
  //   effect. Valid Facts update the waiting machine's record without making it Online.
  //   Fresh reports wait for approval.
  //
  // Removal:
  // - The server orders the commit of a removal against the commit that admits a stream. A stream
  //   that would be admitted after the removal receives no Welcome, and ends with
  //   `failed_precondition` and unknown_machine.
  // - A stream whose admission committed before the removal may still receive its Welcome after
  //   the removal commits. The server refuses the next frame of that stream with
  //   `failed_precondition` and unknown_machine, sends it no EventAck, and nothing that stream
  //   sends changes the machine. Its connection token opens nothing.
  // - A removal ends every pending command and staged result of the machine as removed.
  // - The server ends the machine's current stream with the same code and reason. Every later
  //   Open of that machine gets a Challenge and then the same code.
  // - The server may send SetState with APPROVAL_REMOVED before it ends the stream, and nothing
  //   waits for its delivery. Welcome.state is never APPROVAL_REMOVED.
  rpc Open(stream OpenRequest) returns (stream OpenResponse);
}

// JoinToken is what the owner copies from the Machines page to a new machine.
//
// The token's text is the prefix `lgtm1_` followed by the binary encoding of this message in
// unpadded base64url. The server makes it, the client reads it, and the website only shows it.
// The text is a secret: no log, board or page other than the one that made it holds it.
message JoinToken {
  // The id of the token. It is safe to show and to store.
  string token_id = 1;
  // 32 random bytes. The server stores only a verifier of them.
  bytes secret = 2;
  // The address at which the server answers this package, such as "https://lgtm.example.net" or
  // "http://127.0.0.1:8787": a scheme, a host and an optional port, with no path. The scheme is
  // https, or http for a loopback address only.
  string address = 3;
  // SHA-256 of the server's Ed25519 public key.
  bytes server_key_sha256 = 4;
  // SHA-256 of the SubjectPublicKeyInfo of the certificate that the server presents at an https
  // address. Every https token carries it. A token for a loopback address over plain HTTP/2 has
  // none.
  bytes certificate_key_sha256 = 5;
}

// JoinRequest is what a new machine sends once, or again when the reply was lost.
message JoinRequest {
  // The token's id, from JoinToken.token_id.
  string token_id = 1;
  // The token's secret, from JoinToken.secret.
  bytes token_secret = 2;
  // The machine's Ed25519 public key. The private key never leaves the machine.
  bytes machine_public_key = 3;
  // The host name of the machine, at most 255 bytes. The website shows it until the owner names
  // the machine.
  string host_name = 4;
}

// JoinResponse tells a new machine who it is and which server key to trust.
message JoinResponse {
  // The id the server gave the machine. The machine names itself with it in Hello.
  string machine_id = 1;
  // The server's Ed25519 public key. Its SHA-256 equals the token's server_key_sha256, or the
  // client refuses the server. The client keeps it and trusts no other server key.
  bytes server_public_key = 2;
}

// OpenRequest is one message from the machine on the stream.
message OpenRequest {
  // What the machine says on the stream.
  oneof kind {
    // The first message of every stream.
    Hello hello = 1;
    // The second message of every stream.
    Proof proof = 2;
    // That the machine is there, after Welcome.
    Heartbeat heartbeat = 3;
    // One numbered report, sent after Welcome.
    Event event = 4;
    // The answer to one attempt of a command, after Welcome.
    CommandResult command_result = 5;
  }
}

// OpenResponse is one message from the server on the stream.
message OpenResponse {
  // What the server says on the stream.
  oneof kind {
    // The answer of the server to Hello.
    Challenge challenge = 1;
    // The answer to Proof. The stream is open after it.
    Welcome welcome = 2;
    // The answer of the server to a heartbeat.
    HeartbeatAck heartbeat_ack = 3;
    // One cumulative acknowledgement through the last committed event number. See events.proto.
    EventAck event_ack = 4;
    // One attempt of a command for the machine.
    Command command = 5;
  }
}

// Hello names the machine and gives the server a value to sign.
message Hello {
  // The id from JoinResponse.machine_id.
  string machine_id = 1;
  // 32 random bytes, new for each stream.
  bytes machine_nonce = 2;
  // The revision of this package that the client speaks, which is 2. A server refuses a
  // revision it does not speak with `failed_precondition`.
  uint32 link_revision = 3;
  // The client chooses a canonical version 7 UUID once per process and repeats it on reconnect.
  string run_id = 4;
  // The client records the next number, in [1, 2^63], before appending any event of this run.
  // It repeats this immutable boundary on reconnect.
  uint64 first_event_number = 5;
}

// Challenge proves the server and gives the machine a value to sign.
message Challenge {
  // 32 random bytes, new for each stream.
  bytes server_nonce = 1;
  // The server's Ed25519 signature over the server's proof text. See Proof.
  bytes server_signature = 2;
}

// Proof proves the machine.
//
// The proof texts are bytes. Each is a label, one zero byte, one byte that holds the length of
// the machine id, the machine id in UTF-8, the machine nonce and the server nonce. The label of
// the server's text is "lgtm-link-v1 server", and the label of the machine's text is
// "lgtm-link-v1 machine". The file src/contracts/testdata/link-proof.json holds examples.
message Proof {
  // The machine's Ed25519 signature over the machine's proof text.
  bytes machine_signature = 1;
}

// Welcome opens the stream. The stream became the machine's current stream when the server admitted
// it to send this message.
message Welcome {
  // A random token that only this stream's later calls present. It ends when the stream ends or
  // is replaced.
  string connection_token = 1;
  // The machine's standing now. The machine applies it before any command of this stream.
  MachineState state = 2;
  // The durable replay mark for this machine, or 0 before its first committed event.
  // Events.proto says how the machine resumes from this mark.
  uint64 last_event_number = 3;
  // The server's clock, read after Proof verified and before Welcome was sent. Commands.proto
  // says how the machine uses it.
  google.protobuf.Timestamp server_time = 4;
  // The revision of this package that the server speaks, which is 2.
  uint32 link_revision = 5;
}
